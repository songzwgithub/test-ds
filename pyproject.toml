[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypsds-gamma"
version = "1.1.0"
description = "Portable PS/DS InSAR processing for GAMMA RSLC stacks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.11,<1.13",
  "numba>=0.60,<0.67",
  "PyYAML>=6.0,<7",
  "threadpoolctl>=3.5,<4",
  "matplotlib>=3.8,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
pypsds = "pypsds.cli:main"
[tool.setuptools.packages.find]
include = ["pypsds*"]
[tool.setuptools.package-data]
pypsds = ["resources/*.yaml", "resources/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
