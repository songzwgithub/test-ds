paths:
  work_dir: /home/ubuntu/Downloads/psds
  data_dir: /home/ubuntu/Downloads
  rslc_dir: /home/ubuntu/Downloads/RSLC
  rslc_tab: /home/ubuntu/Downloads/RSLC_tab
  output_dir: /home/ubuntu/Downloads/psds/prototype_outputs
gamma:
  rslc_dtype: auto
  byte_order: big
runtime:
  io_workers: 4
prototype:
  roi:
    row0: 0
    col0: 0
    rows: null
    cols: null
  max_dates: null
qa:
  enabled: true
  dpi: 160
ps:
  amplitude_dispersion_threshold: 0.25
moraine_center_prior:
  half_row: 5
  half_col: 5
  p_max: 0.05
  min_shp: 50
shp:
  method: glrt
  alpha: 0.005
  half_window_y: 5
  half_window_x: 11
ds:
  min_shp: 48
  exclude_ps_from_covariance_support: true
phase_linking:
  method: robust_emi
  reference_idx: 0
  beta: 0.05
  gamma_jitter: 1.0e-06
  emi_mu: 0.99
  evd_fallback: true
phase_correction:
  enabled: true
  backend: gamma_phase_sim_orb_pt
  geometric_reference_date: '20151212'
  apply_sign: 1.0
  scratch_dir: phase_correction_v09
  keep_tile_files: false
  force_prepare: false
  commands:
    SLC2pt: SLC2pt
    data2pt: data2pt
    phase_sim_orb_pt: phase_sim_orb_pt
  radar_height:
    path: /home/ubuntu/Downloads/DEM_prep/20151212.hgt
    geometry_par: /home/ubuntu/Downloads/DEM_prep/20151212_4_1.vv.mli.par
    zero_height_is_valid: false
    zero_height_epsilon_m: 0.001
v09:
  phase_cache:
    tile_rows: 128
    tile_cols: 256
    workers: 8
  processing:
    batch_size: 16000
    pl_workers: 16
    pl_chunk_size: 512
network:
  max_temporal_baseline_days: 72
  max_perpendicular_baseline_m: 200.0
  target_connections_each_side: 3
