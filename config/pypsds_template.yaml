schema_version: 1

paths:
  work_dir: .
  data_dir: .
  rslc_dir: RSLC
  rslc_tab: RSLC_tab
  output_dir: output

gamma:
  rslc_dtype: auto
  byte_order: big

processing:
  roi:
    row0: 0
    col0: 0
    rows: null
    cols: null

runtime:
  cpu: auto
  memory_fraction: 0.85
  io_workers: auto

selection:
  ps:
    amplitude_dispersion_max: 0.25

  center_prior:
    enabled: false
    method: moraine_ks
    half_row: 5
    half_col: 5
    p_max: 0.05
    min_count: 50

  shp:
    method: rayleigh_glrt
    alpha: 0.005
    half_row: 5
    half_col: 11
    min_count: 48
    exclude_ps: true

  ds:
    center_mode: all
    temporal_coherence_min: 0.80
    pair_coherence_min: 0.0
    accept_evd: true

phase_linking:
  method: robust_emi
  beta: 0.0
  gamma_jitter: 1.0e-6
  target_eigenvalue: 0.99
  evd_fallback: true
  temporal_reference_index: 0

  temporal:
    strategy: sequential
    ministack_size: 19
    max_num_compressed: 5
    state_min_shp: 24
    full_scm_fallback: true
    fullspan_batch_size: 16384
    emi_backend: threshold_cholesky
    use_exact_support_cache: true

phase_correction:
  enabled: true
  backend: gamma_phase_sim_orb_pt
  # REQUIRED per project: actual GAMMA co-registration reference date YYYYMMDD.
  # The literal string "auto" is an explicit opt-in fallback only.
  geometric_reference_date: null
  apply_sign: 1.0
  scratch_dir: phase_correction

  commands:
    SLC2pt: SLC2pt
    data2pt: data2pt
    phase_sim_orb_pt: phase_sim_orb_pt

  radar_height:
    path: null
    geometry_par: null
    zero_height_is_valid: false
    zero_height_epsilon_m: 0.001

network:
  max_temporal_baseline_days: 72
  max_perpendicular_baseline_m: 200.0
  target_connections_each_side: 3

reference:
  method: radar_window
  # Alternative: point_ids with an explicit project-local .npy point-ID array.
  point_ids_path: null
  min_points: 100
  radar_window:
    center_row: null
    center_col: null
    half_row: 10
    half_col: 15
    min_points: 100
  statistic: median

corrections:
  scla:
    mode: disabled
  atmosphere:
    mode: disabled
